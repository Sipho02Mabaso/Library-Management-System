<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Library | User</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" />
  <link rel="stylesheet" href="css/theme.css?v=4" />
  <link rel="stylesheet" href="css/app.css?v=4" />
  <script src="js/api.js" defer></script>
  <script src="js/auth.js?v=5" defer></script>
  <script src="js/books.js" defer></script>
  <script src="js/rooms.js" defer></script>
  <script src="js/sessions.js" defer></script>
  <script src="js/bookings.js" defer></script>
  <script src="js/profile.js" defer></script>
  <script src="js/debt.js" defer></script>
  <script src="js/saved-books.js" defer></script>
  <script src="js/role-app.js" defer></script>
</head>
<body>
  <div class="sidebar-overlay" id="sidebarOverlay"></div>
  <nav class="top-nav">
    <button class="sidebar-toggle" id="sidebarToggle" aria-label="Toggle navigation"><i class="bi bi-list"></i></button>
    <div class="logo" id="logo"><i class="bi bi-book-half"></i><span>Library Management System</span></div>
  </nav>
  <aside class="sidebar" id="sidebar"><ul id="navLinks">
    <li><a href="#/" data-route="/"><i class="bi bi-house sidebar-icon"></i><span class="sidebar-label">My Library</span></a></li>
    <li><a href="#/books" data-route="/books"><i class="bi bi-book sidebar-icon"></i><span class="sidebar-label">Browse Books</span></a></li>
    <li><a href="#/rooms" data-route="/rooms"><i class="bi bi-building sidebar-icon"></i><span class="sidebar-label">Rooms</span></a></li>
    <li><a href="#/sessions" data-route="/sessions"><i class="bi bi-mic sidebar-icon"></i><span class="sidebar-label">Sessions</span></a></li>
    <li><a href="#/bookings" data-route="/bookings"><i class="bi bi-journal sidebar-icon"></i><span class="sidebar-label">My Bookings</span></a></li>
    <li><a href="#/saved-books" data-route="/saved-books"><i class="bi bi-bookmark-star sidebar-icon"></i><span class="sidebar-label">Saved Books</span></a></li>
    <li><a href="#/debt" data-route="/debt"><i class="bi bi-currency-exchange sidebar-icon"></i><span class="sidebar-label">My Debt</span></a></li>
    <li><a href="#" id="logoutLink"><i class="bi bi-box-arrow-right sidebar-icon"></i><span class="sidebar-label">Log out</span></a></li>
  </ul></aside>
  <main class="main-content" id="mainContent"></main>
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      const app = new RoleApp('User', {
        '/': () => {
          document.getElementById('mainContent').innerHTML = '<div class="page-title"><h1>My Library</h1><p>Browse, borrow, and manage your library activity.</p></div><div class="card-grid"><div class="card"><h3>Books</h3><p>Explore the collection and borrow available titles.</p><a class="btn btn-sm" href="#/books">Browse Books</a></div><div class="card"><h3>Rooms</h3><p>Find an available study or meeting space.</p><a class="btn btn-sm" href="#/rooms">View Rooms</a></div><div class="card"><h3>Sessions</h3><p>Discover upcoming library sessions.</p><a class="btn btn-sm" href="#/sessions">View Sessions</a></div></div>';
        },
        '/books': () => BooksPage.render(),
        '/rooms': () => RoomsPage.render(),
        '/sessions': () => SessionsPage.render(),
        '/bookings': () => BookingsPage.render('books'),
        '/saved-books': () => SavedBooksPage.render(),
        '/debt': () => DebtPage.render(),
        '/profile': () => ProfilePage.render()
      });
      window.roleApp = app;
      app.init();
    });
  </script>
</body>
</html>
